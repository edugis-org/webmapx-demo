<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMapX Demo</title>

  <script type="importmap">
  {
    "imports": {
      "maplibre-gl": "https://esm.sh/maplibre-gl@5",
      "ol": "https://cdn.jsdelivr.net/npm/ol@10/+esm",
      "leaflet": "https://esm.sh/leaflet@1"
    }
  }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@edugis-org/webmapx@latest/dist-lib/webmapx.css">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #error { display: none; font-family: sans-serif; padding: 2rem; color: #c00; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error"></div>

  <script type="module">
    import { WebMapX } from 'https://cdn.jsdelivr.net/npm/@edugis-org/webmapx@latest/dist-lib/webmapx.js';

    const params = new URLSearchParams(window.location.search);
    const configParam = params.get('config') ?? '../config/demo.json';

    try {
      await WebMapX.mount('#map', { config: configParam });
    } catch (e) {
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = 'Failed to load map: ' + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
