name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # site.lock names the exact commit of webmapx and of webmapx-configs this
      # site is built from. Pinning is a publication decision and this is what
      # publishes, so both pins live here; webmapx's own repository holds no
      # lock, and its Pages deploy is a preview that follows main.
      #
      # `npm run publish:site-latest` writes this file, and pushing it is what
      # triggers this workflow — so every build has a commit saying what went
      # out, and a site that was tested cannot change because another
      # repository moved.
      - name: Build webmapx
        run: |
          # Read, don't require: node only parses .json as JSON, and would run a
          # .lock through the JavaScript parser.
          WEBMAPX_COMMIT=$(node -p "JSON.parse(require('fs').readFileSync('site.lock','utf8')).webmapx.commit")
          echo "Building webmapx at $WEBMAPX_COMMIT"
          git clone --filter=blob:none https://github.com/edugis-org/webmapx.git /tmp/webmapx
          git -C /tmp/webmapx checkout --detach "$WEBMAPX_COMMIT"
          cd /tmp/webmapx
          npm ci
          # public/config is a checkout of webmapx-configs; point webmapx's sync
          # at our lock so it serves the configs that were tested with this code.
          WEBMAPX_CONFIGS_LOCK="$GITHUB_WORKSPACE/site.lock" npm run configs:sync
          npm run build
          npm run build:lib

      - name: Build tool documentation pages
        run: |
          npm ci
          WEBMAPX_DIST_LIB=/tmp/webmapx/dist-lib npm run build:tool-docs

      - name: Assemble site
        run: |
          mkdir -p dist/testpages dist/assets dist/dist-lib dist/config dist/demo
          # testpages (setup + preview) and their bundled assets from webmapx build
          cp -R /tmp/webmapx/dist/testpages/. dist/testpages/
          cp -R /tmp/webmapx/dist/assets/. dist/assets/
          # lib build for demo app
          cp -R /tmp/webmapx/dist-lib/. dist/dist-lib/
          # Configs come from webmapx-configs, at the commit webmapx pinned in
          # configs.lock — the same commit its own deployment serves. This site
          # therefore shows the configs that were tested, and cannot change
          # because that repository's main branch moved. `npm run configs:sync`
          # in the webmapx checkout does the fetching; its public/config lands
          # in the build we already copied from.
          cp -R /tmp/webmapx/dist/config/. dist/config/
          # landing page and demo app from this repo
          cp index.html dist/index.html
          cp demos.js dist/demos.js
          cp favicon.png dist/favicon.png
          # per-tool documentation pages, regenerated here so they carry the
          # commit this build pins and the config fragments of the configs it
          # serves — never a committed copy that could describe another version
          mkdir -p dist/tools
          cp -R tools/. dist/tools/
          cp llms.txt dist/llms.txt
          # pre-rendered map screenshots shown while the demo iframes load
          # (generated by `npm run updateMapPreviews`, committed to this repo)
          mkdir -p dist/previews
          cp -R previews/. dist/previews/
          cp -R demo/. dist/demo/
          cp -R /tmp/webmapx/dist/data/. dist/demo/data/
          cp -R /tmp/webmapx/dist/data/. dist/testpages/data/
          # apikeys, once, beside the configs that use them. The keys file is
          # found relative to the *config* (`apiKeysFile`, default
          # ./apikeys.json), so one copy here serves every config in the
          # directory and every page that shows one. It used to be written once
          # per page location — demo/config and testpages/config — because the
          # lookup was relative to the page instead.
          # Optional: silently ignored if missing, but its absence shows up as a
          # 404 in every visitor's console.
          echo '${{ secrets.APIKEYS_JSON }}' > dist/config/apikeys.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
