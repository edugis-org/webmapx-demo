name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # site.lock names the exact commit of webmapx and of webmapx-configs this
      # site is built from. Pinning is a publication decision and this is what
      # publishes, so both pins live here; webmapx's own repository holds no
      # lock; its Pages site (preview.webmapx.com) holds branch previews.
      #
      # `npm run publish:site-latest` writes this file, and pushing it is what
      # triggers this workflow — so every build has a commit saying what went
      # out, and a site that was tested cannot change because another
      # repository moved.
      - name: Build webmapx
        run: |
          # Read, don't require: node only parses .json as JSON, and would run a
          # .lock through the JavaScript parser.
          WEBMAPX_COMMIT=$(node -p "JSON.parse(require('fs').readFileSync('site.lock','utf8')).webmapx.commit")
          echo "Building webmapx at $WEBMAPX_COMMIT"
          git clone --filter=blob:none https://github.com/edugis-org/webmapx.git /tmp/webmapx
          git -C /tmp/webmapx checkout --detach "$WEBMAPX_COMMIT"
          cd /tmp/webmapx
          npm ci
          # public/config is a checkout of webmapx-configs; point webmapx's sync
          # at our lock so it serves the configs that were tested with this code.
          WEBMAPX_CONFIGS_LOCK="$GITHUB_WORKSPACE/site.lock" npm run configs:sync
          npm run build
          npm run build:lib

      # The rest of the site — landing page, demo app, tool documentation,
      # coastal zones data — around the webmapx build. In a script rather than
      # here because webmapx's branch previews (preview.webmapx.com) run the
      # same assembly with the branch's webmapx in place of the pinned one.
      - name: Assemble site
        env:
          APIKEYS_JSON: ${{ secrets.APIKEYS_JSON }}
        run: |
          npm ci
          npx tsx scripts/assemble-site.ts /tmp/webmapx dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
