name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build webmapx
        run: |
          git clone --depth 1 https://github.com/edugis-org/webmapx.git /tmp/webmapx
          cd /tmp/webmapx
          npm ci
          npm run build
          npm run build:lib

      - name: Assemble site
        run: |
          mkdir -p dist/testpages dist/assets dist/dist-lib dist/config dist/styles dist/demo
          # testpages (setup + preview) and their bundled assets from webmapx build
          cp -R /tmp/webmapx/dist/testpages/. dist/testpages/
          cp -R /tmp/webmapx/dist/assets/. dist/assets/
          # lib build for demo app
          cp -R /tmp/webmapx/dist-lib/. dist/dist-lib/
          # demo configs and styles from this repo
          cp -R config/. dist/config/
          # upstream default config wins over this repo's copy (see NOTES.md);
          # stories-demo/ holds assets that demo.json references relatively
          cp /tmp/webmapx/dist/config/demo.json dist/config/
          cp -R /tmp/webmapx/dist/config/stories-demo dist/config/
          cp -R styles/. dist/styles/
          # landing page and demo app from this repo
          cp index.html dist/index.html
          cp demos.js dist/demos.js
          cp favicon.png dist/favicon.png
          # pre-rendered map screenshots shown while the demo iframes load
          # (generated by `npm run updateMapPreviews`, committed to this repo)
          mkdir -p dist/previews
          cp -R previews/. dist/previews/
          cp -R demo/. dist/demo/
          cp -R /tmp/webmapx/dist/data/. dist/demo/data/
          cp -R /tmp/webmapx/dist/data/. dist/testpages/data/
          # apikeys for demo page (optional — silently ignored if missing)
          mkdir -p dist/demo/config
          echo '${{ secrets.APIKEYS_JSON }}' > dist/demo/config/apikeys.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
