name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build webmapx
        run: |
          git clone --depth 1 https://github.com/edugis-org/webmapx.git /tmp/webmapx
          cd /tmp/webmapx
          npm ci
          # public/config is a checkout of webmapx-configs; sync takes the
          # commit configs.lock names, so this site serves the pinned configs.
          npm run configs:sync
          npm run build
          npm run build:lib

      - name: Assemble site
        run: |
          mkdir -p dist/testpages dist/assets dist/dist-lib dist/config dist/demo
          # testpages (setup + preview) and their bundled assets from webmapx build
          cp -R /tmp/webmapx/dist/testpages/. dist/testpages/
          cp -R /tmp/webmapx/dist/assets/. dist/assets/
          # lib build for demo app
          cp -R /tmp/webmapx/dist-lib/. dist/dist-lib/
          # Configs come from webmapx-configs, at the commit webmapx pinned in
          # configs.lock — the same commit its own deployment serves. This site
          # therefore shows the configs that were tested, and cannot change
          # because that repository's main branch moved. `npm run configs:sync`
          # in the webmapx checkout does the fetching; its public/config lands
          # in the build we already copied from.
          cp -R /tmp/webmapx/dist/config/. dist/config/
          # landing page and demo app from this repo
          cp index.html dist/index.html
          cp demos.js dist/demos.js
          cp favicon.png dist/favicon.png
          # pre-rendered map screenshots shown while the demo iframes load
          # (generated by `npm run updateMapPreviews`, committed to this repo)
          mkdir -p dist/previews
          cp -R previews/. dist/previews/
          cp -R demo/. dist/demo/
          cp -R /tmp/webmapx/dist/data/. dist/demo/data/
          cp -R /tmp/webmapx/dist/data/. dist/testpages/data/
          # apikeys for demo page (optional — silently ignored if missing)
          mkdir -p dist/demo/config
          echo '${{ secrets.APIKEYS_JSON }}' > dist/demo/config/apikeys.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
